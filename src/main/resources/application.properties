spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scheduledawg}
spring.datasource.username=${DB_USERNAME:scheduledawg_user}
spring.datasource.password=${DB_PASSWORD:scheduledawg123}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway now owns the schema (see src/main/resources/db/migration). Spring Boot
# 4.1's autoconfigure module has no built-in Flyway support to configure here —
# migrations run explicitly in ScheduleDawgApplication.main(), before the
# Spring context (and this ddl-auto=validate check) starts up.

anthropic.api.key=${ANTHROPIC_API_KEY}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT signing secret (256-bit, base64) and token lifetime (30 days).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=2592000000

# Comma-separated list of origins allowed to call the API (see CorsConfig).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Used to build the link inside password-reset emails (see PasswordResetService).
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# Password-reset email, sent via Resend (https://resend.com). Left blank by
# default so the app still boots without it — EmailService just logs and
# skips sending until RESEND_API_KEY is set. onboarding@resend.dev works
# without verifying a custom domain, but can only send to the email address
# on the Resend account itself until one is verified.
resend.api.key=${RESEND_API_KEY:}
mail.from=${MAIL_FROM:onboarding@resend.dev}
